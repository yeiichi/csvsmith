[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csvsmith"
version = "0.7.0"
description = "Small CSV utilities: row deduplication, classification, row filtering, and CLI helpers."
readme = "README.rst"
requires-python = ">=3.10"
license = { file = "LICENSE" }

authors = [
  { name = "Eiichi YAMAMOTO", email = "info@yeiichi.com" }
]

keywords = [
  "csv",
  "deduplication",
  "data-filtering",
  "file-organization",
  "filtering",
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries",
  "Topic :: Utilities",
]

dependencies = [
  "openpyxl>=3.1",
]

[project.urls]
Homepage = "https://github.com/yeiichi/csvsmith"
Repository = "https://github.com/yeiichi/csvsmith"

[project.scripts]
csvsmith = "csvsmith.cli:main"

[tool.setuptools.packages.find]
where = ["src"]