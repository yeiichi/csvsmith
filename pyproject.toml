[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csvsmith"
version = "0.10.0"
description = "Small CSV utilities: row deduplication, classification, row filtering, and CLI helpers."
readme = "README.rst"
requires-python = ">=3.10"
license = { file = "LICENSE" }

authors = [
  { name = "Eiichi YAMAMOTO", email = "info@yeiichi.com" }
]

keywords = [
  "csv",
  "deduplication",
  "data-filtering",
  "file-organization",
  "filtering",
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries",
  "Topic :: Utilities",
]

dependencies = [
  "openpyxl>=3.1",
]

[project.optional-dependencies]
docs = [
  "sphinx>=8,<9",
  "furo>=2024.8.6",
]

[project.urls]
Homepage = "https://github.com/yeiichi/csvsmith"
Repository = "https://github.com/yeiichi/csvsmith"
Documentation = "https://csvsmith.readthedocs.io/en/latest/"

[project.scripts]
csvsmith = "csvsmith.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.semantic_release]
allow_zero_version = true
build_command = "python -m pip install build twine && python -m build && python -m twine check dist/*"
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.changelog]
mode = "update"
insertion_flag = "..\n    version list"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.rst"
output_format = "rst"
